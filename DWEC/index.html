<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover y Active en CSS</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #0f172a;
            font-family: system-ui, sans-serif;
        }

        /* Caja Hola Mundo */
        .caja {
            padding: 2.5rem 4rem;
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 1.5rem;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);

            /* Transición suave para todos los efectos */
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.3s ease,
                        background 0.3s ease;
        }

        /* 1. Al pasar el ratón por encima (:hover) se eleva y cambia el color */
        .caja:hover {
            transform: translateY(-16px) scale(1.06);
            box-shadow: 0 25px 35px -5px rgba(168, 85, 247, 0.5);
            background: linear-gradient(135deg, #a855f7, #ec4899);
        }

        /* 2. Al hacer clic (:active) se presiona hacia abajo */
        .caja:active {
            transform: translateY(2px) scale(0.96);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="caja">
        Hola Mundo
    </div>

</body>
</html>
