services:
  app:
    image: php:8.3-apache
    container_name: php_app
    volumes:
      - ./web:/var/www/html
    ports:
      - "8080:80"
    depends_on:
      - db
    restart: always
    environment:
       MYSQL_HOST: db
       MYSQL_USER: user
       MYSQL_PASSWORD: user
       MYSQL_DATABASE: blog
  db:
    image: mysql:8.0
    container_name: blog
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: blog
      MYSQL_USER: user
      MYSQL_PASSWORD: user
    volumes:
      - db_data:/var/lib/mysql
    restart: always
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: secret
    ports:
      - "8081:80"
    depends_on:
      - db
    restart: always
volumes:
  db_data:
