services:
  autotaller_web:
    build: .
    container_name: autotaller_web
    ports:
      - "8086:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - autotaller_db
    networks:
      - autotaller_net

  autotaller_db:
    image: mysql:8.0
    container_name: autotaller_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: autotaller_db
      MYSQL_USER: autotaller
      MYSQL_PASSWORD: password123
    volumes:
      - autotaller_db_data:/var/lib/mysql
      - ./databases/base-de-dades.sql:/docker-entrypoint-initdb.d/01_init.sql
    networks:
      - autotaller_net

  autotaller_phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: autotaller_phpmyadmin
    ports:
      - "8087:80"
    environment:
      PMA_HOST: autotaller_db
    depends_on:
      - autotaller_db
    networks:
      - autotaller_net

volumes:
  autotaller_db_data:

networks:
  autotaller_net:
