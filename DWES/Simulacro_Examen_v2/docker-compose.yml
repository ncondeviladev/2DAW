services:
  web:
    build: .
    container_name: vetclinic_web
    ports:
      - "8082:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: vetclinic_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vetclinic_db
      MYSQL_USER: vetclinic
      MYSQL_PASSWORD: password123
    volumes:
      - db_data_v2:/var/lib/mysql
      - ./databases/base-de-dades.sql:/docker-entrypoint-initdb.d/01_init.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: vetclinic_phpmyadmin
    environment:
      PMA_HOST: db
    ports:
      - "8083:80"
    depends_on:
      - db

volumes:
  db_data_v2:
