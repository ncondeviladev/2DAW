services:
  web:
    build: .
    container_name: helpdesk_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: helpdesk_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: helpdesk_db
      MYSQL_USER: helpdesk
      MYSQL_PASSWORD: password123
    volumes:
      - db_data:/var/lib/mysql
      - ./databases/base-de-dades.sql:/docker-entrypoint-initdb.d/01_init.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: helpdesk_phpmyadmin
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  db_data:
