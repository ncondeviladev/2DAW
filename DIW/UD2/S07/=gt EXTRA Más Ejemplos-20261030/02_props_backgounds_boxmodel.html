<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Propiedades Backgrounds - Modelo Caja</title>
  <style type="text/css">
    /*** DIRECTIVAS ****/
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@100;400;700;900&display=swap');
    
    @font-face {
      font-family: "MiFuente";
      src: url(./ttf/3dumb.ttf);
    }

    /* UNIVERSAL - Inicializaciones*/
    *{
      margin: 0; padding: 0;
      text-decoration: none;
      box-sizing: border-box;
     /* border: 1px dotted red; */
    }

    /* De ELEMENTO */
    :root{ /* es html */
       font-family: 'Roboto','Arial',sans-serif;  /* heredable */ /* sans-serif es el fallback */
       font-size: 16px; /* 1rem=16px*/
       background-image: url(img/flecha.jpg), url(img/O5GLLH0.jpg);
       background-repeat: no-repeat, repeat;
       background-position: 3rem 3rem, left;
       background-attachment: scroll, fixed;
     }

    body{
      width: 90%;
      margin: 0 auto;
      background-color: rgb(100%,100%,100%,0.7);/* 0.7 alfa */
      padding: 2rem;
      border-radius: 0 0 2rem 2rem;
      
    }

    h1, 
    h3, 
    h4{
      font-family: 'MiFuente', 'Comics Sans MS', fantasy;
      color: blue;
      text-transform: capitalize;
      letter-spacing: 0.3em;
      text-shadow: red -2px -2px 2px, green 3px 3px 2px ;
      /* PROPIEDADES DEL MODELO DE CAJAS */
      margin-bottom: 0.5em; /* relativo al tamaño de letra de cada tipo */
      padding: 0.3em;
      border-bottom: 2px solid red;
      border-left: 3px dotted green;
      border-right: 3px double blue;
      outline: 2px dotted red;
      box-shadow: 3px 3px 5px grey;
    }
    form input{
      border-radius: 0.5em;
    }
    form input:active{
      outline: 2px solid red;
    }
    /* Descendientes */
    p em{
      font-weight: lighter;
      font-style: oblique;
    }

    p strong{
      font-weight: 900; /* equivale a bolder */
      
    }

    main a{
      text-decoration:underline;
    }

    main h2{
      font-family: Arial, Helvetica, sans-serif;
      color: transparent;
      -webkit-text-stroke: 1px red;
    }

    /* Ejemplo de hover */
    main img#img1{
      opacity: 0.5;
    }

    main img#img1:hover{
      opacity: 1;
    } 

</style>
</head>

<body>
	<main>
    <h1 id="titul1">Ejemplo <span><strong>selectores</strong></span> complejos </h1>
    <h2> Subtítulo </h2>
    <p>Vamos a ver ejemplos de <strong><em>selectores</em></strong></p>
    <p>También veremos  <strong>pseudo-clases</strong> ,
         <em>pseudo-elementos</em> 
       y <em>pseudo-estados</em> bla, bla, bla, bla
    </p>
    <a href="http://www.w3schools.com/cssref/css_selectors.asp" class="rojo">MÁS INFO</a>
    <a href="http://www.w3schools.com/cssref/css_selectors.asp" class="morado">OTRO ENLACE</a>
    <p>
      <img id="img1" src="img/1.jpg" alt="paisaje">
    </p>
    <hr/>
    <h1 id="titul2">Tabla</h1>
    <table width="400" border="1">
      <tr>
        <th class="rojo">Clasificacion</th>
        <th>Puntos</th>
        <th>+info</th>
      </tr>
      <tr>
        <td class="rojo">Alcoyano</td> <td>13</td>
        <td><a href="http://cdalcoyano.com">web</a></td>
      </tr>
      <tr>
        <td class="rojo">Elche</td> <td>10</td>
        <td><a href="http://www.elchecf.es">web</a></td>
      </tr>
      <tr>
        <td class="rojo">Alcoyano</td> <td>13</td>
        <td><a href="http://cdalcoyano.com">web</a></td>
      </tr>
      <tr>
        <td class="rojo">Elche</td> <td>10</td>
        <td><a href="http://www.elchecf.es">web</a></td>
      </tr>
    </table>
    <hr/>
    <h1 id="titul3">Formulario</h1>
    <form name="frmdatos">
   		<input type="text" name="nombre" /><br/>
        <input type="text" name="apellido" /><br/>
        <select name="sexo">
			      <option value="h">hombre</option>
            <option value="m">mujer</option>
        </select><br/>
        <select name="nacionalidad" disabled>
			     <option value="ue" >Europeo</option>
           <option value="no">No Europeo</option>
        </select><br/>
        <input type="checkbox" id="s1" name="sexo[]" value="h"/><label for="s1">Home</label>
        &nbsp;&nbsp;&nbsp;
        <input type="checkbox" id="s2" name="sexo[]" value="d"/><label for="s2">Dona</label> <br/>
        <input type="button" value="Enviar" />
        <input type="button" value="Cancelar" />
	</form> 
	</main>  
</body>
</html>
