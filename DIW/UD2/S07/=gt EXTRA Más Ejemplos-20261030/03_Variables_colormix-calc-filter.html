<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplos vars y propiedades avanzadas</title>
    <style>
         /* DIRECTIVAS */
         @charset "utf-8";
        /* aquí arriba irían todas: @font-face   @import  ... */

        /* SELECTORES */
        *{  /* Inicialización */
            padding: 0; margin: 0; 
            box-sizing: border-box;
            text-decoration: none;
            
        }

        :root{
            /* VARIABLES: custom properties */
            /* COLORES BASE */
            --main-color: #ff4400; 
            --sec-color: #372e86; 
            /* PALETA a.p de COLORES BASE */
            --backg-color: color-mix(in srgb-linear, var(--main-color), white 90%);
            --h1-color: color-mix(in srgb-linear, var(--sec-color), var(--main-color) 60%);
            --h2-color: color-mix(in srgb-linear, var(--sec-color), var(--main-color) 30%);
            --h3-color: color-mix(in srgb-linear, var(--sec-color), var(--main-color) 20%);
            --hx-backg: color-mix(in srgb-linear, var(--sec-color), white 60%);
            --html-color: color-mix(in srgb-linear,var(--main-color),black 80%);    
            /* Fuente principal */
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px; /* 1rem= 16px */
            background-color: var(--html-color);
        }

        body { 
            width: calc(100% - 4rem); /* Calculado en tpo ejecución el propio Navegador */
            margin: 0 auto; /* Centrado */
            padding: 1em;
            background-color: var(--backg-color);
        }

        /* Formatos Letras cabeceras */
        main :is(h1,h2,h3){ 
            letter-spacing: calc(1em/4);
            margin: 0 0.2em 0.5em 0;/* shorthand */
            padding: 0.5em; /* short-hand, las 4 propiedades toman mismo valor */
            background-color: var(--hx-backg);
            border-radius: 0.5em; /* shorthand */
        }

        main h1{ 
            color: var(--h1-color);
        }
        main h2{ 
            color: var(--h2-color);
        }
        main h3{ 
            color: var(--h3-color);
        }
        
        main p{ 
            color: var(--main-color);
            margin-bottom: 1em;
        }
        main strong{ color: color-mix(in srgb, var(--main-color), black 50%)}

        /* Galería Imágenes */
        /* Usamos propiedad filter */
        section#galeria img{
            width: calc(100%/3 - 2em);
            margin-right: 1em;
        }
        section#galeria img:nth-child(1){
            filter: blur(3px);
        }

        section#galeria img:nth-child(2){
            filter: sepia(100%);
         }

        section#galeria img:nth-child(3){
            filter: contrast(200%) grayscale(90%) blur(1px);
         }
        
        section#galeria img:hover{
            filter: none;
        }
        /* Formulario */
        form input{ 
            border:2px solid var(--sec-color);
            accent-color: var(--sec-color); /* Colores para radio, checkbox, progress */
        }
        form input[type="text"]{
            outline-color: var(--sec-color);
        }
        form input[type="button"]{
            padding: 0.5em;
            border-radius: 0.5em;
            font-weight: bold;
        }
        form input[type="button"]:hover{
            background-color: var(--sec-color);
            color: var(--backg-color);
        }

        /* CONVERTIR UN UL EN BOTONERA */
        nav{
            margin: 1rem 0;
        }

        nav ul{
            list-style: none;
        }
        
        nav ul li{
            display: inline-block; /* Es para que los li esten unos al lado del otro */
            width: 10rem;
            margin: 0 2rem;
        }

        nav ul li a{
            display: block; /* Que cojan todo lo disponible de su li */
            color: var(--main-color);
            /* Modelo de cajas */
            border: 1px solid var(--sec-color);
            border-radius: 0.5rem;
            padding: 0.5em;
            box-shadow: calc(1em/5) calc(1em/5) calc(1em/3) var(--main-color);
            /* Fuente */
            text-align: center;
            font-weight: bold;
        }
        
        nav ul li a:hover{
            color: var(--backg-color);
            background-color: var(--sec-color);
        }

        nav ul li a:active{
            transform: scale(0.95,0.95);
            box-shadow: calc(1em/8) calc(1em/8) calc(1em/5) var(--main-color);
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="htdocs/home.html">Home</a></li>
            <li><a href="htdocs/compras.html">Compras</a></li>
            <li><a href="htdocs/contacta.html">Contacta</a></li>
        </ul>
    </nav>
    <main>
        <section id="noticias">   
            <h1>Ejemplo 1</h1>
            <h2>Cabecera 2</h2>
            <h3>Cabecera 3</h2>
            
            <p> <strong>Lorem ipsum</strong> dolor sit amet consectetur adipisicing elit. Provident reiciendis aspernatur dolores maiores</p></pa>
        </section>
        <section id="galeria">
            <h1>Galeria</h1>
            <p> <img src="img/1.jpg" alt="cañon" >
                <img src="img/1.jpg" alt="cañon" >
                <img src="img/1.jpg" alt="cañon" >
            </p>
        </section>
        <section id="formulari">
            <form action="">
                <p><label for="nom">Nombre</label>
                <input type="text" id="nom" name="nom"></p>
                <p><label for="socio">¿Socio?</label>
                    <input type="checkbox" id="socio" name="socio" checked> &nbsp;
                    <input type="radio" name="issocio"> &nbsp;
                    <input type="radio" name="issocio">
                </p>
                    
                <p><input type="button" value="Enviar"></p>
            </form>

        </section>    
    </main>
</body>
</html>
