<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Position Fixed y Sticky</title>
    <style type="text/css">
        *{  /* INICIALIZAMOS */
            margin: 0; padding: 0;
            text-decoration: none;
            box-sizing: border-box; /* IMPORTANTE */
            /* etc, etc */
        }
    
        :root{ /* FIJAMOS BGROUND, Y FUENTE BASE */
            font-family: "Arial","Verdana",sans-serif;
            font-size: 16px; /* ahora 1rem=16px */
            background-color: grey;
        }
        
        body{ /* CONTAINER PRIMARIO */
            background-color: white;
            width: 90%;
            padding: 1rem;
            margin: 0 auto; /* AUTOCENTRADO */
            height: 300rem;
        }
        
        div#capa1{
            border: 5px solid blue;
            width: 10rem;
            height: 10rem;
        }
        
        div#capa2{
            position: relative;
            border: 5px solid green;
            width: 10rem;
            height: 10rem;
            left: 1rem;/*Se moverá respecto a donde le tocaba caer, al ser relative */
            top:  3rem;
        }
        
        div#capa3{
            position:  relative;
            border: 5px solid purple;
            width: 5rem;
            height: 5rem;
            left: 1rem;/*Se moverá respecto a donde le tocaba caer, al ser relative */
            top:  1rem;
            /*** PODEMOS USAR DE FORMA ANÁLOGA 
             * transform: translate(1rem, 1rem)
             * o margin-left y margin-top 
             * ***/
        }
        
        aside#cookies{
            z-index: 1;
            position: fixed; /* Este container siempre se queda pegado a bottom:0 */
            left: 0; bottom: 0;
            width: 100%;
            padding: 2rem;
            background-color: black;
            color:  white;
            font-weight: bold;
            text-align: center;
        }

        nav{
            z-index: 1;
            position: sticky; /* se comporta como static, hasta que al hacer scrooll el container alcanza top:0, entonces se queda pegado */
            top:0;            
            background-color: red;
            padding: 1rem;
        }
    </style>
    
    
</head>
<body>
    <header>
        <h1>Position FIXED y STICKY</h1>
    </header>
    <nav>Navegador: se pegará arriba al hacer scroll</nav>
    <main>
        <div id="capa1"></div>
        <p>Texto de ejemplo</p>
        <div id="capa2">
            <div id="capa3">Texto
            </div>
        </div>    
        <p>Texto de ejemplo</p>
    </main>

    <aside id="cookies">
        <p>Pollitica de cookies <button>Aceptar</button></p>
    </aside>
    <script type="text/javascript">
         function cerrarCook(){
            document.getElementById('cookies').style="";
         }        
     </script> 
</body>
